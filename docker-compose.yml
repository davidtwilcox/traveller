services:
  api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:5000
    depends_on:
      - api
